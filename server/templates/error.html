{% extends "base.html" %}
{% block title %}{{ title }} — Hệ thống chấm bài lập trình | Trường THCS Sông Lô{% endblock %}

{% block content %}
  <div class="container" style="padding-top:64px;padding-bottom:80px;max-width:640px">
    <section class="card">
      <p class="stat__value" style="font-size:56px;color:var(--fg-subtle);line-height:1">{{ code }}</p>
      <h1 class="mt-3" style="font-size:22px">{{ title }}</h1>
      <p class="text-muted mt-2 mb-4">{{ message }}</p>
      <div class="row">
        <a class="btn btn--primary" href="{{ url_for('index') }}">Về trang chủ</a>
        <a class="btn btn--outline" href="{{ url_for('problems') }}">Danh sách đề bài</a>
      </div>
    </section>
  </div>
{% endblock %}
